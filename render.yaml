# Render Blueprint for the Ihsan Academy web app.
services:
  - type: web
    name: ihsan-academy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACADEMY_PRODUCTION
        value: "1"
      - key: ACADEMY_STORAGE
        value: postgres
      - key: ACADEMY_REQUIRE_HTTPS
        value: "0"
      - key: ACADEMY_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ihsan-academy-db
          property: connectionString
      - key: ACADEMY_BOOTSTRAP_ADMIN_NAME
        value: "مدير أكاديمية الإحسان"
      - key: ACADEMY_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: ACADEMY_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: ihsan-academy-db
    databaseName: ihsan_academy_db
    user: ihsan_academy_db_user
    plan: free
