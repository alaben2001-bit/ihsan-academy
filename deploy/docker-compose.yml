services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - academy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U academy -d academy"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ACADEMY_PRODUCTION: "1"
      ACADEMY_STORAGE: postgres
      DATABASE_URL: postgresql://academy:${POSTGRES_PASSWORD}@db:5432/academy
      ACADEMY_REQUIRE_HTTPS: "0"
      ACADEMY_COOKIE_SECURE: "1"
      ACADEMY_MEDIA_ROOT: /app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - academy_media:/app/data/uploads
      - academy_backups:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACADEMY_DOMAIN: ${ACADEMY_DOMAIN:?set ACADEMY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://academy:${POSTGRES_PASSWORD}@db:5432/academy
    command: >-
      sh -c 'mkdir -p /backups; while true; do out="/backups/postgres-$$(date +%Y%m%d-%H%M%S).dump"; pg_dump "$${DATABASE_URL}" --format=custom --file="$${out}" && sha256sum "$${out}" > "$${out}.sha256" && find /backups -type f -name "postgres-*.dump" -mtime +14 -delete && find /backups -type f -name "postgres-*.dump.sha256" -mtime +14 -delete; sleep 86400; done'
    volumes:
      - academy_backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  academy_pg:
  academy_media:
  academy_backups:
  caddy_data:
  caddy_config:
