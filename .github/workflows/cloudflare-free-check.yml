name: Cloudflare free migration checks
on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/cloudflare/**"
      - "assets/**"
      - "index.html"
      - "manifest.json"
  push:
    branches: ["migration/cloudflare-student-platform"]
    paths:
      - "deploy/cloudflare/**"
      - "assets/**"
      - "index.html"
      - "manifest.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package.json
      - run: npm install
      - run: npm run check
      - run: npm run prepare:assets
      - run: npx wrangler deploy --dry-run

  integration:
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package.json
      - run: npm install
      - name: Prepare static assets
        run: npm run prepare:assets
      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply ihsan-academy-students --local
      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8788 --var BOOTSTRAP_SECRET:test-bootstrap-secret-1234 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8788/api/health >/dev/null; then echo "ready"; break; fi
            sleep 1
          done
      - name: Run student journey and store tests (first: expects an empty catalog)
        run: node scripts/journey-store-test.mjs
      - name: Run points economy tests
        run: node scripts/points-local-test.mjs
      - name: Run Quran path tests
        run: node scripts/quran-path-test.mjs
      - name: Run backup/restore drill
        run: node scripts/backup-restore-test.mjs
      - name: Run role/permission tests
        run: node scripts/role-permission-test.mjs
      - name: Run competitions tests
        run: node scripts/competitions-test.mjs
      - name: Run mobile identity and group-creation smoke test
        run: node scripts/mobile-smoke-test.mjs
      - name: Stop wrangler dev
        if: always()
        run: pkill -f "wrangler dev" || true
      - name: Upload wrangler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: /tmp/wrangler.log