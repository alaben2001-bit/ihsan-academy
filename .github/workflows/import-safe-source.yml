name: Import safe academy source archive

on:
  push:
    paths:
      - "ihsan-v49-cloud-source-safe.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract safe source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f ihsan-v49-cloud-source-safe.zip
          mkdir -p /tmp/ihsan-source
          unzip -q ihsan-v49-cloud-source-safe.zip -d /tmp/ihsan-source
          rsync -a --exclude='.git/' /tmp/ihsan-source/ ./
          rm -f ihsan-v49-cloud-source-safe.zip
          # Never commit local student databases, SQLite files, secrets, or uploads.
          rm -f data/db.json .env
          find . -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) -not -path './.git/*' -delete
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import safe academy source archive"
          git push